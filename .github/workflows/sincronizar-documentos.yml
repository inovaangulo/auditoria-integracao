name: Sincronizar documentos dos colaboradores

# Roda sozinho de 3 em 3 horas em horario comercial (8h, 11h, 14h, 17h,
# horario de Brasilia = UTC-3, sem horario de verao), de segunda a sexta.
# Cron do GitHub Actions e' sempre em UTC, por isso 11,14,17,20.
# "workflow_dispatch" continua disponivel para rodar manualmente quando quiser.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,14,17,20 * * 1-5'

# id-token: write e' o que permite trocar a identidade deste job por um token
# do Microsoft Graph, sem nenhum segredo guardado no GitHub.
permissions:
  id-token: write
  contents: read

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sincronizar-documentos.mjs
